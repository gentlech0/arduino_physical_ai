<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>temperatureerature Realtime</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    display:grid;
    height:100vh;

    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
}

.temp{
    grid-column:1;
    grid-row:1;
    padding:20px;
}

.hum{
    grid-column:1;
    grid-row:2;
    padding:20px;
}

.graph{
    grid-column:2;
    grid-row:1 / span 2;
    padding:20px;
    border-left:1px solid #ccc;
}    

</style>
</head>
<body>

<div class="temp">温度

</div>

<div class="hum">湿度

</div>

<div class="graph">
<h2>temperatureerature Realtime Graph</h2>
<canvas id="chart"></canvas>
