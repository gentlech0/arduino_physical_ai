<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="sans-serif" font-size="14">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="760" height="470" fill="#fff"/>
<text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold">Arduino と LCD の間の抵抗(電圧を下げる分圧)</text>
<rect x="30" y="60" width="150" height="150" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
<text x="105" y="95" text-anchor="middle" font-weight="bold">Arduino</text>
<text x="105" y="120" text-anchor="middle" font-size="12">信号の High =</text>
<text x="105" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e7d32">5V</text>
<rect x="580" y="60" width="150" height="150" rx="10" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
<text x="655" y="95" text-anchor="middle" font-weight="bold">LCD(ST7735)</text>
<text x="655" y="120" text-anchor="middle" font-size="12">受けられる信号は</text>
<text x="655" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">3.3V前後まで</text>
<line x1="180" y1="120" x2="260" y2="120" stroke="#333" stroke-width="2"/>
<rect x="260" y="105" width="80" height="30" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="300" y="125" text-anchor="middle" font-size="13">R1 1kΩ</text>
<line x1="340" y1="120" x2="580" y2="120" stroke="#333" stroke-width="2"/>
<circle cx="430" cy="120" r="4" fill="#333"/>
<line x1="430" y1="120" x2="430" y2="150" stroke="#333" stroke-width="2"/>
<rect x="415" y="150" width="30" height="60" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="455" y="185" font-size="13">R2 2kΩ</text>
<line x1="430" y1="210" x2="430" y2="235" stroke="#333" stroke-width="2"/>
<line x1="415" y1="235" x2="445" y2="235" stroke="#333" stroke-width="2"/><line x1="421" y1="242" x2="439" y2="242" stroke="#333" stroke-width="2"/><line x1="426" y1="249" x2="434" y2="249" stroke="#333" stroke-width="2"/>
<text x="430" y="268" text-anchor="middle" font-size="12">GND</text>
<text x="300" y="92" text-anchor="middle" font-size="12" fill="#555">直列の抵抗</text>
<text x="480" y="108" font-size="12" fill="#c62828" font-weight="bold">ここの電圧がLCDに届く</text>
<rect x="30" y="290" width="700" height="160" rx="8" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
<text x="50" y="318" font-weight="bold">なぜ必要か(データシートから)</text>
<text x="50" y="343" font-size="13">・UNO R4 WiFi のメインマイコン(RA4M1)は 5V 動作で、信号の High も 5V です。</text>
<text x="50" y="366" font-size="13">・ST7735 の信号入力は「電源(VDDI)+0.3V」まで。VDDI の絶対最大は 4.6V、通常は約3.3Vで使います。</text>
<text x="50" y="389" font-size="13">・5V をそのまま入れると、LCD の定格を超えて壊れるおそれがあります。</text>
<text x="50" y="412" font-size="13">・そこで R1 と R2 で電圧を割り(分圧)、5V を約3.3V に下げて LCD に渡します。</text>
<text x="50" y="435" font-size="13">・計算式: LCDに届く電圧 = 5V × R2 ÷ (R1 + R2) = 5V × 2k ÷ 3k ≒ 3.3V(本機の値)</text>
</svg>
