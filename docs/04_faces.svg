<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="sans-serif" font-size="14">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="760" height="520" fill="#fff"/>
<text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold">表情の決め方(上から順にチェック)</text>
<g fill="#fff" stroke="#555" stroke-width="2">
<rect x="40" y="60" width="240" height="50" rx="8"/><rect x="40" y="140" width="240" height="50" rx="8"/>
<rect x="40" y="220" width="240" height="50" rx="8"/><rect x="40" y="300" width="240" height="50" rx="8"/></g>
<g text-anchor="middle">
<text x="160" y="90">温度が 23℃ より高い?</text><text x="160" y="170">温度が 20℃ より低い?</text>
<text x="160" y="250">湿度が 60% より高い?</text><text x="160" y="330">湿度が 40% より低い?</text></g>
<g stroke="#333" stroke-width="2" marker-end="url(#a)">
<line x1="160" y1="110" x2="160" y2="138"/><line x1="160" y1="190" x2="160" y2="218"/>
<line x1="160" y1="270" x2="160" y2="298"/><line x1="160" y1="350" x2="160" y2="398"/>
<line x1="280" y1="85" x2="440" y2="85"/><line x1="280" y1="165" x2="440" y2="165"/>
<line x1="280" y1="245" x2="440" y2="245"/><line x1="280" y1="325" x2="440" y2="325"/></g>
<g font-size="12" fill="#c62828"><text x="360" y="78" text-anchor="middle">はい</text><text x="360" y="158" text-anchor="middle">はい</text>
<text x="360" y="238" text-anchor="middle">はい</text><text x="360" y="318" text-anchor="middle">はい</text></g>
<g font-size="12" fill="#1565c0"><text x="172" y="130">いいえ</text><text x="172" y="210">いいえ</text>
<text x="172" y="290">いいえ</text><text x="172" y="380">いいえ</text></g>
<g text-anchor="middle" font-weight="bold">
<rect x="440" y="62" width="280" height="46" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="580" y="90">暑い顔(hot)</text>
<rect x="440" y="142" width="280" height="46" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/><text x="580" y="170">寒い顔(cold)</text>
<rect x="440" y="222" width="280" height="46" rx="8" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/><text x="580" y="250">湿気の顔(hum)</text>
<rect x="440" y="302" width="280" height="46" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/><text x="580" y="330">乾燥の顔(dry)</text>
<rect x="40" y="400" width="240" height="46" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="160" y="428">快適な顔(fine)</text></g>
<text x="380" y="480" text-anchor="middle" font-size="13" fill="#555">温度のチェックが先です。たとえば 25℃・湿度70% なら、湿度より温度を優先して「暑い顔」になります。</text>
</svg>
