<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="sans-serif" font-size="15">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="760" height="370" fill="#fff"/>
<text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold">全体のしくみ</text>
<rect x="30" y="120" width="160" height="90" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
<text x="110" y="155" text-anchor="middle" font-weight="bold">温湿度センサ</text>
<text x="110" y="177" text-anchor="middle">DHT22</text>
<text x="110" y="197" text-anchor="middle" font-size="12">温度・湿度をはかる</text>
<rect x="300" y="105" width="170" height="120" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
<text x="385" y="140" text-anchor="middle" font-weight="bold">Arduino UNO R4 WiFi</text>
<text x="385" y="165" text-anchor="middle" font-size="12">(頭脳)</text>
<text x="385" y="190" text-anchor="middle" font-size="12">値を見て判断・表示・通信</text>
<rect x="570" y="55" width="160" height="90" rx="10" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
<text x="650" y="90" text-anchor="middle" font-weight="bold">LCD(液晶)</text>
<text x="650" y="112" text-anchor="middle" font-size="12">数値と表情を表示(メイン)</text>
<rect x="570" y="190" width="160" height="90" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" stroke-dasharray="6 4"/>
<text x="650" y="225" text-anchor="middle" font-weight="bold">ブラウザ(サブ機能)</text>
<text x="650" y="247" text-anchor="middle" font-size="12">スマホ・PCで</text>
<text x="650" y="265" text-anchor="middle" font-size="12">温度グラフを見るだけ</text>
<line x1="190" y1="165" x2="298" y2="165" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="244" y="150" text-anchor="middle" font-size="12">①測定値</text>
<line x1="470" y1="140" x2="568" y2="105" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="540" y="150" text-anchor="middle" font-size="12">②表示</text>
<line x1="470" y1="190" x2="568" y2="225" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="548" y="204" text-anchor="middle" font-size="12">③WiFi(サブ)</text>
<rect x="300" y="270" width="170" height="50" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="385" y="293" text-anchor="middle" font-weight="bold">9V乾電池</text>
<text x="385" y="311" text-anchor="middle" font-size="12">電気を供給(持ち運べる)</text>
<line x1="385" y1="270" x2="385" y2="227" stroke="#c62828" stroke-width="2" marker-end="url(#a)"/>
<text x="395" y="252" font-size="12" fill="#c62828">電源</text>
<text x="380" y="352" text-anchor="middle" font-size="13" fill="#555">実線 = 配線でつなぐ / 点線 = 無線(WiFi)でつなぐ / 赤 = 電源</text>
</svg>
